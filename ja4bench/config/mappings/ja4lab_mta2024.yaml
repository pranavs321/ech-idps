# Mapping: ja4lab flow table (MTA 2024) -> canonical table. Used by T07.
columns:
  capture_id: pcap
  ja4: ja4
  sni: sni
  src_ip: src_ip
  dst_ip: dst_ip
  dst_port: srv_port
  ja4t: ja4t
  ttl: cli_ttl
  win: syn_win
  ts: ts_start
constants:
  source: mta2024
  vantage: lan_tap
per_capture_csv: data/meta/capture_meta_mta2024.csv
label:
